<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Works — Will Wang</title>
  <meta name="description" content="Selected works by Will Wang.">
  <link rel="stylesheet" href="/works/works.css">
  <script src="/works/works.js" defer></script>
</head>
<body>
  <main class="works-shell">
    <header class="works-header">
      <div class="works-heading">
        <h1 id="page-title">Works</h1>
        <span id="works-count" class="works-count" aria-live="polite">—</span>
      </div>

      <div id="language-toggle" class="language-toggle" role="group" aria-label="Language">
        <button class="language-option" type="button" data-locale="zh" aria-pressed="false">中文</button>
        <span class="language-divider" aria-hidden="true">/</span>
        <button class="language-option" type="button" data-locale="en" aria-pressed="true">EN</button>
      </div>
    </header>

    <p id="works-intro" class="works-intro"><button id="profile-trigger" class="profile-trigger" type="button" aria-controls="work-drawer" aria-expanded="false" aria-label="Open Will's profile">Will <span aria-hidden="true">→</span></button> — a builder exploring the interface between human thought and AI, asking: what remains constant as everything changes?</p>

    <nav id="works-filters" class="works-filters" aria-label="Filter works by type"></nav>

    <section id="works-grid" class="works-grid" aria-label="Selected works">
      <p class="works-state">Loading…</p>
    </section>
  </main>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

  <aside id="work-drawer" class="work-drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <button id="drawer-close" class="drawer-close" type="button" aria-label="Close details">×</button>
    <div id="drawer-content" class="drawer-content"></div>
  </aside>

  <noscript>
    <p class="noscript">This page needs JavaScript to load the works manifest.</p>
  </noscript>
</body>
</html>
