name: Navigation regression
on:
  pull_request:
  push:
    branches: [master]
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check works/works.js
      - run: node scripts/check-navigation.mjs
